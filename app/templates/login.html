<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connex</title>
<link rel="stylesheet" href="/static/css/style.css">
<link rel="icon" href="/static/images/m-chat-logo-3.png">
</head>
<body>
  <div class="auth-page">
    <!-- ═══════════════════════════════════════════════════════════════ -->
    <!-- LEFT SIDE — Animated Background                               -->
    <!-- ═══════════════════════════════════════════════════════════════ -->
    <div class="auth-bg">
      <div class="auth-bg-overlay"></div>

      <!-- Floating animated shapes -->
      <div class="auth-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
        <div class="shape shape-4"></div>
        <div class="shape shape-5"></div>
        <div class="shape shape-6"></div>
      </div>

      <div class="auth-bg-content">
        <div class="auth-logo-wrap">
          <div class="auth-logo-ring"></div>
          <img src="/static/images/m-chat-logo-3.png" class="auth-logo-svg" width="60" alt="logo">
        </div>
        <h1 class="auth-title">Connex</h1>
        <p class="auth-subtitle">Connect with anyone, anywhere.</p>
        <div class="auth-bg-features">
          <div class="auth-feature" style="--i:0">
            <div class="feature-icon">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.9)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
            </div>
            <span>Real-time messaging</span>
          </div>
          <div class="auth-feature" style="--i:1">
            <div class="feature-icon">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.9)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
            </div>
            <span>Video calls</span>
          </div>
          <div class="auth-feature" style="--i:2">
            <div class="feature-icon">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.9)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
            </div>
            <span>Share media</span>
          </div>
        </div>
      </div>
    </div>

    <!-- ═══════════════════════════════════════════════════════════════ -->
    <!-- RIGHT SIDE — Login / Register Forms                           -->
    <!-- ═══════════════════════════════════════════════════════════════ -->
    <div class="auth-right">
      <div class="auth-card">
        <div class="auth-card-header">
          <h2 id="formTitle">Welcome back</h2>
          <p id="formSubtitle">Sign in to continue</p>
        </div>

        <div class="auth-forms-wrap">
        <form id="loginForm" class="auth-form">
          <div class="input-group">
            <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#888" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <input type="text" id="loginUsername" placeholder="Username" required autocomplete="username">
          </div>
          <div class="input-group">
            <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#888" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input type="password" id="loginPassword" placeholder="Password" required autocomplete="current-password">
            <button type="button" class="password-toggle" onclick="togglePassword('loginPassword', this)" tabindex="-1" aria-label="Toggle password visibility">
              <svg class="eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#888" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="eye-closed hidden" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#888" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </div>
          <button type="submit" class="auth-submit" id="loginSubmitBtn">
            <span class="btn-text">Sign In</span>
            <span class="btn-spinner hidden"><span class="spinner"></span></span>
            <svg class="btn-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
          </button>
        </form>

        <form id="registerForm" class="auth-form auth-hidden">
          <div class="input-group">
            <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#888" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <input type="text" id="regUsername" placeholder="Username" required autocomplete="off">
          </div>
          <div class="input-group">
            <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#888" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
            <input type="email" id="regEmail" placeholder="Email" required autocomplete="email">
          </div>
          <div class="input-group">
            <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#888" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input type="password" id="regPassword" placeholder="Password" required autocomplete="new-password">
            <button type="button" class="password-toggle" onclick="togglePassword('regPassword', this)" tabindex="-1" aria-label="Toggle password visibility">
              <svg class="eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#888" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="eye-closed hidden" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#888" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </div>
          <div class="pw-strength" id="regPwStrength">
            <div class="pw-bar"><div class="pw-bar-fill" id="regPwBarFill"></div></div>
            <span class="pw-label" id="regPwLabel"></span>
          </div>
          <button type="submit" class="auth-submit" id="registerSubmitBtn">
            <span class="btn-text">Create Account</span>
            <span class="btn-spinner hidden"><span class="spinner"></span></span>
            <svg class="btn-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
          </button>
        </form>
        </div>

        <div class="auth-toggle">
          <span id="toggleText">Don't have an account?</span>
          <a id="toggleLink" onclick="toggleAuth()">Register</a>
        </div>

        <p id="authMessage" class="message"></p>
      </div>
    </div>
  </div>

  <script src="/static/js/auth.js"></script>
</body>
</html>
